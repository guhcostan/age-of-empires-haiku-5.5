name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Testes unitários da simulação
        run: npm test
      - name: Instalar Chromium para os testes E2E
        run: npx playwright install --with-deps chromium
      - name: Testes end-to-end
        run: npx playwright test
      - name: Relatório dos testes E2E em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
