name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Testes unitários da simulação
        run: npm test
      - name: Build (tipos e empacotamento)
        run: npm run build
      - name: public/ precisa estar igual ao build do código
        run: |
          if [ -n "$(git status --porcelain -- public)" ]; then
            echo "public/ está desatualizado em relação ao código: rode npm run build e faça commit de public/."
            git status --porcelain -- public
            exit 1
          fi
      - name: Instalar Chromium para os testes E2E
        run: npx playwright install --with-deps chromium
      - name: Testes end-to-end
        run: npx playwright test
      - name: Relatório dos testes E2E em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
